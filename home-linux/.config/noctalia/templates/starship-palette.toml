# Noctalia template -> the [palettes.noctalia] block starship-apply.sh splices
# into the merged machine-local starship config.
[palettes.noctalia]
accent = "{{colors.primary.default.hex}}"
on_accent = "{{colors.on_primary.default.hex}}"
label_bg = "{{colors.surface_container.default.hex}}"
text = "{{colors.on_surface.default.hex}}"
divider = "{{colors.outline.default.hex}}"
error = "{{colors.error.default.hex}}"

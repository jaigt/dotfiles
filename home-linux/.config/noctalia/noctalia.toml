# Hand-managed. GUI/IPC settings write to ~/.local/state/noctalia/settings.toml,
# which loads last and wins; delete that to reset.

[shell]
font_family = "CaskaydiaCove Nerd Font"
time_format = "{:%-I:%M %p}"

    [shell.panel]
    transparency_mode = "glass"

[backdrop]
enabled = true

[bar.default]
thickness = 46
scale = 1.15
background_opacity = 0.88
start = [ "launcher", "workspaces", "active_window" ]
center = [ "clock" ]
# Desktop machine: no battery, no backlight.
end = [
    "media",
    "tray",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "notifications",
    "control-center",
    "session"
]

# shell.time_format alone doesn't reach the bar clock widget.
[widget.clock]
type = "clock"
format = "{:%-I:%M %p}"

[widget.network]
show_label = false

# No colour overrides, so pills follow the active scheme either way.
[widget.workspaces]
hide_when_empty = true

# Tray drawer; right-click an icon to pin it back into the bar.
[widget.tray]
drawer = true
drawer_columns = 3

[location]
auto_locate = true

[control_center]
sidebar = "full"

# Idle duties taken over from hypridle.
[idle]
    [idle.behavior.lock]
    enabled = true
    timeout = 600.0

    [idle.behavior.screen-off]
    enabled = true
    timeout = 660.0

    [idle.behavior.lock-and-suspend]
    enabled = true
    timeout = 1800.0

[wallpaper]
enabled = true
directory = "/home/jaigt/Pictures/wallpapers"

[lockscreen]
blur_intensity = 0.6
tint_intensity = 0.35

[theme]
mode = "dark"
# Wallpaper-driven colour. Back to the strict palette with:
#   noctalia msg color-scheme-set custom KanagawaHybrid
source = "wallpaper"
custom_palette = "KanagawaHybrid"

    # Hooks write *through* symlinks, so anything whose hook would edit a
    # repo-linked config is wired as a user template below emitting colours
    # only, into a machine-local file.
    [theme.templates]
    enable_builtin_templates = true
    builtin_ids = ["btop"]
    enable_community_templates = false

    # colors.lua prefers this over Kanagawa. The hook bumps mtime only, so
    # wezterm hot-reloads.
    [theme.templates.user.wezterm]
    input_path = "templates/wezterm-colors.lua"
    output_path = "$XDG_CONFIG_HOME/wezterm/colors-noctalia.lua"
    post_hook = "touch $HOME/.config/wezterm/wezterm.lua"

    # plugins/colorscheme.lua owns the SIGUSR1 handler.
    [theme.templates.user.neovim]
    input_path = "templates/nvim-matugen.lua"
    output_path = "$XDG_CONFIG_HOME/nvim/lua/matugen.lua"
    post_hook = "pkill -USR1 -x nvim || true"

    # Native accent via user.js: the community full-restyle CSS fought Zen's
    # own theming. Applies on next browser start.
    [theme.templates.user.zen-accent]
    input_path = "templates/zen-accent.txt"
    output_path = "$XDG_CACHE_HOME/noctalia/zen-browser/accent"
    post_hook = "bash $HOME/.config/noctalia/templates/zen-apply.sh"

    # Merged into a machine-local starship-noctalia.toml (STARSHIP_CONFIG, set
    # in .zshrc). Starship rereads every prompt, so open shells recolor live.
    [theme.templates.user.starship]
    input_path = "templates/starship-palette.toml"
    output_path = "$XDG_CACHE_HOME/noctalia/starship-palette.toml"
    post_hook = "bash $HOME/.config/noctalia/templates/starship-apply.sh"

    # user.css lives in the repo; the generated color.ini stays machine-local.
    [theme.templates.user.spicetify]
    input_path = "templates/spicetify-text.ini"
    output_path = "$XDG_CONFIG_HOME/spicetify/Themes/text/color.ini"
    post_hook = "spicetify -q apply --no-restart"

    # Enable once in Vesktop Settings -> Themes. No hook needed.
    [theme.templates.user.vesktop]
    input_path = "templates/vesktop-midnight.css"
    output_path = "$XDG_CONFIG_HOME/vesktop/themes/noctalia.theme.css"

"$schema" = 'https://starship.rs/config-schema.json'

# Waybar-style bar prompt.
#
#    icon  path  venv  branch 
#
# The closing cap is carried by [character] -- the only module that
# renders on every single prompt.
#
# Generated by gen_starship.py -- regenerating overwrites this file.

format = "$directory${custom.venv}${custom.git}$character"

add_newline = false
command_timeout = 1000

[directory]
format = "[](fg:#9ccfd8)[ 󰉋 ](bg:#9ccfd8 fg:#1e1e1e)[ $path ](bg:#2f2f2f fg:#e0def4)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true

# Active virtualenv/conda env, basename only -- shows nothing outside one.
[custom.venv]
description = "active python virtualenv name"
when = "test -n \"$VIRTUAL_ENV$CONDA_DEFAULT_ENV\""
command = "basename \"${VIRTUAL_ENV:-$CONDA_DEFAULT_ENV}\""
format = "[](bg:#2f2f2f fg:#6e6a86)[  $output ](bg:#2f2f2f fg:#f6c177)"

# Replaces git_branch + git_status; see the note at the top of the
# generator. Renders nothing outside a repo.
[custom.git]
description = "branch name, with * if the tree is dirty"
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1"
command = "b=$(git symbolic-ref --short -q HEAD 2>/dev/null || git describe --tags --exact-match 2>/dev/null || git rev-parse --short HEAD 2>/dev/null); [ -n \"$b\" ] || exit 0; [ -n \"$(git status --porcelain 2>/dev/null | head -n1)\" ] && b=\"$b*\"; printf %s \"$b\""
format = "[](bg:#2f2f2f fg:#6e6a86)[  $output ](bg:#2f2f2f fg:#9ccfd8)"

[character]
format = "[](fg:#2f2f2f) $symbol "
success_symbol = "[❯](bold #9ccfd8)"
error_symbol = "[❯](bold #eb6f92)"

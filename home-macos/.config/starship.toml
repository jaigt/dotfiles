"$schema" = 'https://starship.rs/config-schema.json'

# Generated by gen_starship.py -- regenerating overwrites this file.

format = "$directory${custom.venv}${custom.git}${custom.git_dirty}$character"

add_newline = false
command_timeout = 1000

[directory]
format = "[$path](fg:#e0def4)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true

[custom.venv]
description = "active python virtualenv name"
when = "test -n \"$VIRTUAL_ENV$CONDA_DEFAULT_ENV\""
command = "basename \"${VIRTUAL_ENV:-$CONDA_DEFAULT_ENV}\""
format = "[ / ](fg:#6e6a86)[ $output](fg:#f6c177)"

# Replaces git_branch + git_status; see the generator.
[custom.git]
description = "current branch, tag or short SHA"
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1"
command = "git symbolic-ref --short -q HEAD 2>/dev/null || git describe --tags --exact-match 2>/dev/null || git rev-parse --short HEAD 2>/dev/null"
format = "[ / ](fg:#6e6a86)[ $output](fg:#9ccfd8)"

# Separate module so the marker can carry its own colour; see the generator.
[custom.git_dirty]
description = "* when the working tree is dirty"
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1"
command = "[ -n \"$(git status --porcelain 2>/dev/null | head -n1)\" ] && printf \"*\"; exit 0"
format = "[$output](fg:#ebbcba)"

[character]
format = " $symbol "
success_symbol = "[❯](bold #9ccfd8)"
error_symbol = "[❯](bold #eb6f92)"
